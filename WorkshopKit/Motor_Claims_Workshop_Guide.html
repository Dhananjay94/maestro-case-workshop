<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Claims workshop</title>
<meta name="description" content="Build a motor insurance claims case in UiPath Maestro, one stage at a time.">
<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --surface-2:#f3efe8; --ink:#1c2230; --ink-2:#4a5368; --muted:#6b7488;
  --line:#e4ded3; --line-2:#cfc7b8; --accent:#3b5bdb; --accent-ink:#ffffff; --accent-soft:#e7ecff;
  --good:#2b8a3e; --good-bg:#e6f5ea; --warn:#b45309; --warn-bg:#fff4e0; --bad:#c92a2a; --bad-bg:#fdeaea;
  --why:#6741d9; --why-bg:#efeafd; --heads:#0b7285; --heads-bg:#e3f6fa;
  --t-agent:#7048e8; --t-function:#1971c2; --t-api:#0c8599; --t-human:#d9480f; --t-connector:#c2255c;
  --shadow:0 1px 2px rgba(28,34,48,.06),0 6px 20px rgba(28,34,48,.06);
  --radius:14px; --maxw:880px; --fs:17px;
}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1f2b; --surface-2:#222836; --ink:#eef0f6; --ink-2:#c3c9d8; --muted:#97a0b5;
  --line:#2b3243; --line-2:#3a4358; --accent:#7c93ff; --accent-ink:#0e1220; --accent-soft:#232c52;
  --good:#69db7c; --good-bg:#17301f; --warn:#ffc078; --warn-bg:#3a2a12; --bad:#ff8787; --bad-bg:#3b1c1c;
  --why:#b197fc; --why-bg:#2a2347; --heads:#66d9e8; --heads-bg:#12303a;
  --t-agent:#b197fc; --t-function:#74c0fc; --t-api:#63e6be; --t-human:#ffa94d; --t-connector:#f783ac;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --surface:#1a1f2b; --surface-2:#222836; --ink:#eef0f6; --ink-2:#c3c9d8; --muted:#97a0b5;
    --line:#2b3243; --line-2:#3a4358; --accent:#7c93ff; --accent-ink:#0e1220; --accent-soft:#232c52;
    --good:#69db7c; --good-bg:#17301f; --warn:#ffc078; --warn-bg:#3a2a12; --bad:#ff8787; --bad-bg:#3b1c1c;
    --why:#b197fc; --why-bg:#2a2347; --heads:#66d9e8; --heads-bg:#12303a;
    --t-agent:#b197fc; --t-function:#74c0fc; --t-api:#63e6be; --t-human:#ffa94d; --t-connector:#f783ac;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root.present{--fs:21px;--maxw:1000px}

*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;overflow-wrap:anywhere}
h1,h2,h3,h4{line-height:1.2;margin:0}
a{color:var(--accent)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .38em;border-radius:6px;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:12px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--ink);text-decoration:none;font-size:.95rem}
.brand i{width:20px;height:20px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--t-connector));display:inline-block}
#nav{display:flex;gap:2px;flex-wrap:wrap}
#nav a{padding:6px 11px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-size:.88rem;font-weight:600}
#nav a:hover{background:var(--surface-2)}
#nav a.on{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap}

/* buttons */
.btn{font:inherit;font-size:.9rem;font-weight:600;padding:9px 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .08s,box-shadow .15s}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:.82rem;border-radius:9px}
.linkbtn{font:inherit;font-size:.82rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 6px;text-decoration:underline}
.copy{font:inherit;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;flex:none}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}

/* page frame */
#app{outline:none}
.page{max-width:var(--maxw);margin:0 auto;padding:28px 16px 80px}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.8rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.pagehead{margin:8px 0 20px}
.pagehead h1,.hero h1{font-size:2.1rem;letter-spacing:-.01em}
.lead{font-size:1.08rem;color:var(--ink-2);max-width:62ch;margin:10px 0 0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.sec{font-size:1.35rem;margin:36px 0 12px}
.sec-k{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:34px 0 10px}
p{margin:0 0 12px}
ul,ol{padding-left:1.3em;margin:0 0 12px}
li{margin:0 0 6px}
.next{margin-top:36px;display:flex;gap:10px;flex-wrap:wrap}

/* hero + panels */
.hero{padding:14px 0 6px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:26px 0;box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.panel-h h2{font-size:1.2rem}

/* map */
.mapwrap{margin:14px 0 8px;padding-top:30px;position:relative}
.map{list-style:none;margin:0;padding:0;display:flex;gap:0;align-items:stretch}
.node{flex:1;position:relative;padding:0 6px 0 0;min-width:0}
.node:not(:last-child)::after{content:"";position:absolute;right:-3px;top:50%;width:14px;height:2px;background:var(--line-2);z-index:0}
.node-box{display:flex;flex-direction:column;gap:3px;height:100%;padding:12px 10px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);text-decoration:none;color:var(--ink);position:relative;z-index:1;transition:transform .12s,border-color .12s,box-shadow .15s}
.node-box:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.node-no{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.78rem;font-weight:800;color:var(--ink-2)}
.node-name{font-weight:800;font-size:.95rem}
.node-sub{font-size:.76rem;color:var(--muted);line-height:1.3}
.node.built .node-box{border-color:var(--good);background:var(--good-bg)}
.node.built .node-no{background:var(--good);color:var(--accent-ink)}
.node.current .node-box{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.token{position:absolute;top:-30px;left:14px;width:28px;height:28px;border-radius:50%;background:var(--t-connector);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem;z-index:3;animation:bob 1.8s ease-in-out infinite;box-shadow:0 3px 8px rgba(0,0,0,.25)}
@keyframes bob{50%{transform:translateY(-4px)}}
.finish{margin-top:12px;color:var(--good);font-weight:700}
.side{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side-k{font-size:.78rem;color:var(--muted);font-weight:700;margin-right:4px}
.ghost{border:2px dashed var(--line-2);border-radius:10px;padding:6px 12px;font-size:.84rem;color:var(--muted);font-weight:600;display:inline-flex;flex-direction:column}
.ghost small{font-size:.68rem;font-weight:500}
.mapwrap.compact{padding-top:26px;margin:0 0 18px}
.compact .node-box{padding:8px 8px;flex-direction:row;align-items:center;gap:7px}
.compact .node-no{width:20px;height:20px;font-size:.68rem;flex:none}
.compact .node-name{font-size:.8rem}

/* chapters */
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chapter{padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.chapter.open{border-color:var(--accent);box-shadow:var(--shadow)}
.chapter.open:hover{transform:translateY(-2px)}
.chapter.locked{opacity:.65;border-style:dashed}
.ch-no{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chapter h3{font-size:1.1rem}
.ch-go{margin-top:auto;color:var(--accent);font-weight:700;font-size:.9rem}
.ch-lock{margin-top:auto;font-size:.8rem;color:var(--muted)}
.mind{border-color:var(--why)}

/* story + sections */
.story{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--t-connector);border-radius:var(--radius);padding:6px 20px 8px;margin-top:8px}
.story .sec-k{margin-top:14px}
.story p{font-size:1.04rem}

/* think cards */
.think{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.think-top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.think-kind{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--why);background:var(--why-bg);padding:3px 10px;border-radius:99px}
.think-q{font-size:1.08rem;font-weight:600;margin:6px 0 12px}
.think-actions{display:flex;gap:8px}
.hint{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--ink)}
.hint .k{font-weight:800;color:var(--warn);text-transform:uppercase;font-size:.74rem;letter-spacing:.06em}
.answer{border-top:1px dashed var(--line-2);padding-top:14px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer-lead{font-size:1.02rem}
.answer-note{margin-top:10px;padding:9px 13px;border-radius:10px;background:var(--heads-bg);font-size:.92rem}
.selfcheck{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.k{font-weight:700;color:var(--muted)}
.pill{font:inherit;font-size:.82rem;font-weight:600;padding:5px 13px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill.on-nailed{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pill.on-close{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.pill.on-missed{background:var(--why-bg);border-color:var(--why);color:var(--why)}
.chip{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);text-decoration:none;margin:0 4px 4px 0}
a.chip:hover{background:var(--accent-soft);color:var(--accent)}
.chip.soft{background:var(--good-bg);color:var(--good)}

/* tasks + rules inside answers */
.tasklist{display:grid;gap:10px;margin:12px 0}
.taskrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.taskrow-head{display:flex;gap:12px;align-items:flex-start}
.taskrow-head>div{flex:1;min-width:0}
.taskrow-sub{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:4px}
.taskrow-line{font-size:.9rem;color:var(--ink-2);margin:8px 0 6px}
.taskrule{font-size:.86rem;padding-top:8px;border-top:1px dashed var(--line)}
.act-code{font-size:.95rem;font-weight:700}
.act-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#fff;flex:none}
.act-icon.t-agent{background:var(--t-agent)}.act-icon.t-function{background:var(--t-function)}.act-icon.t-api{background:var(--t-api)}.act-icon.t-human{background:var(--t-human)}.act-icon.t-connector{background:var(--t-connector)}
.badge{font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:99px;color:#fff}
.badge.t-agent{background:var(--t-agent)}.badge.t-function{background:var(--t-function)}.badge.t-api{background:var(--t-api)}.badge.t-human{background:var(--t-human)}.badge.t-connector{background:var(--t-connector)}
:root[data-theme="dark"] .badge,:root[data-theme="dark"] .act-icon{color:#10131b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge,:root:not([data-theme="light"]) .act-icon{color:#10131b}}
.rule{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.rule-label{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rule-plain{font-weight:600;margin:4px 0 10px}
.kvline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.kvline .k{min-width:84px}
.expr{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.why-line{font-size:.9rem;color:var(--ink-2);margin:8px 0 0}
.codeline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.codeline code{padding:5px 10px}

/* build steps */
.step .think{border:0;box-shadow:none;padding:0;margin:0 0 10px;background:transparent}
.step-h .think-kind{margin-left:auto;flex:none}
.step-title{flex:1}
.buildit{margin-top:16px;padding-top:14px;border-top:2px solid var(--accent-soft)}
.build-t{font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.prog{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.prog-bar{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;max-width:320px}
.prog-bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.scen{list-style:none;padding:0;margin:8px 0 12px}
.scen li{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:0 0 6px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.step{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:0 0 12px;overflow:hidden}
.step.done{opacity:.7}
.step-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface-2)}
.step-h input{width:20px;height:20px;accent-color:var(--good);flex:none}
.step-h label{font-weight:700;display:flex;gap:10px;align-items:center;cursor:pointer;flex:1}
.step-no{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.78rem;flex:none}
.step-b{padding:14px 16px 6px}
.kv{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px}
.kvrow{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.kvrow:last-child{border-bottom:0}
.kvk{font-size:.82rem;font-weight:700;color:var(--muted)}
.kvv code{font-size:.9em;background:transparent;padding:0}
.tablewrap{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:12px}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--surface-2);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl .narrow{width:1%;white-space:nowrap}
.tbl.info{table-layout:auto}
.tbl.info td,.tbl.info th{vertical-align:top;overflow-wrap:break-word}
.tbl.info td:first-child{min-width:9em}
.tbl.info.two td:first-child{width:38%}

/* callouts */
.callout{border-radius:12px;padding:10px 16px 6px;margin:0 0 14px;border-left:5px solid var(--line-2);background:var(--surface-2)}
.callout-t{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.callout.why{background:var(--why-bg);border-color:var(--why)}.callout.why .callout-t{color:var(--why)}
.callout.check{background:var(--good-bg);border-color:var(--good)}.callout.check .callout-t{color:var(--good)}
.callout.stuck{background:var(--warn-bg);border-color:var(--warn)}.callout.stuck .callout-t{color:var(--warn)}
.callout.note,.callout.heads{background:var(--heads-bg);border-color:var(--heads)}.callout.note .callout-t,.callout.heads .callout-t{color:var(--heads)}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:0 0 14px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.mini h4{margin-bottom:4px}
.mini p{font-size:.9rem;margin:0}
.builtbox{display:flex;gap:10px;align-items:center;font-weight:700;padding:12px 16px;border:2px dashed var(--good);border-radius:12px;background:var(--good-bg);cursor:pointer;margin-top:6px}
.builtbox input{width:20px;height:20px;accent-color:var(--good)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}

/* activities drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--bg);border-left:1px solid var(--line-2);box-shadow:-12px 0 40px rgba(0,0,0,.25);transform:translateX(102%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column}
.drawer-open .scrim{opacity:1;pointer-events:auto}
.drawer-open .drawer{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:1.2rem}
.drawer-body{padding:14px 16px 40px;overflow-y:auto;flex:1}
.search,.select{width:100%;font:inherit;font-size:.9rem;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);margin-bottom:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.actlist{display:grid;gap:10px}
.act{border:1px solid var(--line);border-left:5px solid var(--line-2);border-radius:12px;padding:12px 14px;background:var(--surface)}
.act.t-agent{border-left-color:var(--t-agent)}.act.t-function{border-left-color:var(--t-function)}.act.t-api{border-left-color:var(--t-api)}.act.t-human{border-left-color:var(--t-human)}.act.t-connector{border-left-color:var(--t-connector)}
.act.later{opacity:.78}
.act.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:none}}
.act-top{display:flex;gap:10px;align-items:center}
.act-name{flex:1;min-width:0;font-weight:800}
.act-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.studio{font-size:.74rem;color:var(--muted)}
.act-line{font-size:.9rem;color:var(--ink-2);margin:0 0 8px}
.gives,.used{font-size:.82rem;margin-bottom:4px}
.var{margin:0 4px 4px 0;display:inline-block}

@media (max-width:760px){
  .pagehead h1,.hero h1{font-size:1.65rem}
  .map{flex-direction:column;gap:8px}
  .node{padding:0}
  .node:not(:last-child)::after{display:none}
  .mapwrap{padding-top:12px}
  .token{top:-6px;left:auto;right:10px}
  .kvrow{grid-template-columns:1fr auto}
  .kvk{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

<script>
/* Motor Claims workshop site: a small single-page app. Hash routes, no server, works from a file or GitHub Pages. */
(function () {
  "use strict";

  /* **bold**, `code`, [label](#/route) */

    tools.appendChild(h("button", { class: "btn small", type: "button", id: "btn-present", "aria-pressed": "false", onclick: function () { setPresent(!document.documentElement.classList.contains("present")); } }, "Present"));
    tools.appendChild(h("button", { class: "btn small", type: "button", id: "btn-theme", onclick: function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      setTheme(dark ? "light" : "dark");
    } }, "Light / dark"));
    var th; try { th = localStorage.getItem(KEY + "-theme"); } catch (e) { th = null; }
    if (th) document.documentElement.setAttribute("data-theme", th);
    var pr; try { pr = localStorage.getItem(KEY + "-present"); } catch (e) { pr = null; }
    if (pr === "1") setPresent(true);
    document.addEventListener("keydown", function (e) {
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === "Escape") closeDrawer();
      else if (e.key === "ArrowRight") go(1);
      else if (e.key === "ArrowLeft") go(-1);
      else if (e.key === "a" || e.key === "A") openDrawer();
      else if (e.key === "p" || e.key === "P") setPresent(!document.documentElement.classList.contains("present"));
    });
  }

  var foot = document.querySelector(".foot");
  if (foot) foot.appendChild(h("button", { class: "linkbtn", type: "button", onclick: function () {
    if (window.confirm("Clear your ticks and progress on this computer?")) {
      try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      location.reload();
    }
  } }, "Reset my progress"));
  buildChrome();
  buildDrawer();
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
